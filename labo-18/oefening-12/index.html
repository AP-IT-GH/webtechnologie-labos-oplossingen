<!DOCTYPE html>
<html lang="nl-BE">
<head>
  <meta charset="UTF-8">

  <title>oefening 12: pizza samenstellen</title>

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/script.js"></script>
</head>
<body>
  <main>
    <h1>stel je pizza samen</h1>

    <form id="pizzaForm">
      <label>
        <input type="checkbox" value="mozzarella" data-price="2.50"> mozzarella (€ 2,50)
      </label>
      <label>
        <input type="checkbox" value="salami" data-price="3.00"> salami (€ 3,00)
      </label>
      <label>
        <input type="checkbox" value="champignons" data-price="1.75"> champignons (€ 1,75)
      </label>
      <label>
        <input type="checkbox" value="ananas" data-price="1.25"> ananas (€ 1,25)
      </label>
    </form>

    <p id="chosen">nog geen toppings gekozen</p>
    <p id="total">Totaal: € 0,00</p>
  </main>
</body>
