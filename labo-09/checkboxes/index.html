<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkboxes</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main class="login">
    <div class="header">
        <img src="./assets/logo.png" width="50" alt="">
        <h2>Music streaming</h2>
    </div>


    <form action="#" method="GET">
        <fieldset>
            <legend>Selecteer je streamingdiensten</legend>
            <input type="checkbox" name="service" value="spotify" id="spotify"><label for="spotify">Spotify</label>
            <input type="checkbox" name="service" value="youtube-music" id="youtube-music"><label for="youtube-music">Youtube
            Music</label>
            <input type="checkbox" name="service" value="deezer" id="deezer"><label for="deezer">Deezer</label>
            <input type="checkbox" name="service" value="tidal" id="tidal"><label for="tidal">Tidal</label>
            <input type="checkbox" name="service" value="soundcloud" id="soundcloud"><label for="soundcloud">SoundCloud</label>
        </fieldset>

        <button>Verzenden</button>
    </form>
</main>
</body>
</html>
