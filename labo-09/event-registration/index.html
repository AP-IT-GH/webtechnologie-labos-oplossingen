<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event-registration</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main class="container">
    <header>
        <img src="./assets/logo.png" alt="" class="logo">
        <h1>Conferentie Registratie</h1>
    </header>
    <form action="#" method="POST" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label for="full-name">Volledige naam</label>
                <input type="text" id="full-name" name="full-name" placeholder="Jan Modaal" required>
            </div>
            <div class="form-group">
                <label for="email">E-mailadres</label>
                <input type="email" id="email" name="email" placeholder="jan@example.com" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" minlength="8" required>
                <small>Minimaal 8 tekens</small>
            </div>

            <div class="form-group">
                <label for="date">Datum van deelname</label>
                <input type="date" id="date" name="date" required>
            </div>
        </div>

        <fieldset>
            <legend>Ticket type</legend>
            <div class="radio-group">
                <span>
                    <input type="radio" id="ticket-early" name="ticket" value="early" checked>
                    <label for="ticket-early">Early Bird</label>
                </span>
                <span>
                    <input type="radio" id="ticket-regular" name="ticket" value="regular">
                    <label for="ticket-regular">Regular</label>
                </span>
                <span>
                    <input type="radio" id="ticket-vip" name="ticket" value="vip">
                    <label for="ticket-vip">VIP</label>
                </span>
            </div>
        </fieldset>

        <fieldset>
            <legend>Workshops</legend>
            <div class="checkbox-group">
                <span>
                    <input type="checkbox" id="workshop-webdesign" name="workshops" value="webdesign">
                    <label for="workshop-webdesign">Web Design</label>
                </span>
                <span>
                    <input type="checkbox" id="workshop-backend" name="workshops" value="backend">
                    <label for="workshop-backend">Backend</label>
                </span>
                <span>
                    <input type="checkbox" id="workshop-devops" name="workshops" value="devops">
                    <label for="workshop-devops">DevOps</label>
                </span>
            </div>
        </fieldset>

        <div class="form-group">
            <label for="source">Hoe heb je ons gevonden?</label>
            <select id="source" name="source">
                <option value="collega">Via een collega</option>
                <option value="social">Social media</option>
                <option value="nieuwsbrief">Nieuwsbrief</option>
                <option value="andere">Andere</option>
            </select>
        </div>

        <div class="form-group">
            <label for="profile-pic">Profielfoto</label>
            <input type="file" id="profile-pic" name="profile-pic">
        </div>

        <div class="form-group">
            <label for="notes">Extra opmerkingen</label>
            <textarea id="notes" name="notes" rows="4"></textarea>
        </div>

        <div class="form-group checkbox-inline">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">Ik ga akkoord met de voorwaarden</label>
        </div>

        <button type="submit">Registreren</button>
    </form>
</main>
</body>
</html>
